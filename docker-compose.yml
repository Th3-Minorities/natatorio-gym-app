name: natatorio-gym-app

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: natatorio-gym-app-proxy:local
    build: ./frontend
    restart: always
    mem_limit: 128m
    logging: *logging
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    image: natatorio-gym-app-php:local
    build: ./docker/php
    restart: always
    mem_limit: 1g
    logging: *logging
    # Same user as the web requests, so no command run with "docker compose exec" creates files as root.
    # For the rare command that needs root: docker compose exec -u root app ...
    user: www-data
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - private_photos:/var/www/private
    environment:
      # Local setup runs before PHP-FPM. Production must set APP_ENV=production.
      BOOTSTRAP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-natatorio_gym}
      DB_USERNAME: ${POSTGRES_USER:-natatorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      # Logs go to "docker compose logs", not to a file, so a file the user cannot write never breaks an answer.
      LOG_CHANNEL: stderr
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_FILENAME=/var/www/html/public/index.php SCRIPT_NAME=/index.php
          REQUEST_METHOD=GET REQUEST_URI=/api/health
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q '"status":"ok"'
      interval: 10s
      timeout: 5s
      retries: 5
      # The first Composer install can take about 10 minutes on Windows; later starts take seconds.
      start_period: 20m

  scheduler:
    image: natatorio-gym-app-php:local
    # Same build as app, so the scheduler also builds and starts without the app service.
    build: ./docker/php
    # Same user as app (see above).
    user: www-data
    working_dir: /var/www/html
    # Waits for the packages, including when CI installs them after starting the stack.
    # Started again if it ever stops, for example if it starts in the moment Composer is still writing.
    restart: always
    mem_limit: 256m
    logging: *logging
    # Passes SIGTERM on, so "docker compose down" does not wait 10 seconds for the kill.
    init: true
    command: ["sh", "-c", "until [ -f vendor/autoload.php ]; do sleep 2; done; exec php artisan schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - private_photos:/var/www/private
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-natatorio_gym}
      DB_USERNAME: ${POSTGRES_USER:-natatorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      LOG_CHANNEL: stderr
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:17.11-bookworm
    restart: always
    mem_limit: 1g
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-natatorio_gym}
      POSTGRES_USER: ${POSTGRES_USER:-natatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-btree-gist.sql:/docker-entrypoint-initdb.d/01-btree-gist.sql:ro
      - ./docker/postgres/02-test-database.sh:/docker-entrypoint-initdb.d/02-test-database.sh:ro
    healthcheck:
      # Over TCP on purpose: while the first-start init scripts run, the temporary server listens only on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27.11
    profiles: ["development"]
    restart: always
    mem_limit: 128m
    logging: *logging
    command: ["--webroot", "/mailpit/"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/mailpit/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  private_photos:
