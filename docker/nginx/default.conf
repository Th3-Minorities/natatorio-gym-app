server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        return 204;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }

    location = /mailpit {
        return 308 /mailpit/;
    }

    location /mailpit/ {
        # Only from this computer, never through the phone tunnel.
        if ($host !~ ^(localhost|127\.0\.0\.1)$) {
            return 404;
        }

        # Looked up per request through Docker's DNS, so the proxy still starts
        # when Mailpit is off (CI and production run without the development profile).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mailpit http://mailpit:8025;
        proxy_pass $mailpit;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}