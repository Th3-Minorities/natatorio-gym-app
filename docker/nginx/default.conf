server {
    listen 80;
    server_name _;

    # Uploads up to 10 MB (same limit as PHP, see docker/php/app.ini). nginx's default is 1 MB.
    client_max_body_size 10m;

    location = /health {
        access_log off;
        return 204;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;

        # When the proxy itself fails, or Laravel cannot start (PHP answers 500 with no body),
        # answer in the API error format (docs/design/api-conventions.md). nginx cannot tell that
        # empty 500 from a 500 Laravel built, so both get this answer: the APP_DEBUG details
        # stay in "docker compose logs". Other Laravel errors are not changed.
        # Keep the texts equal to backend/lang/es/errors.php.
        fastcgi_intercept_errors on;
        error_page 413 @api_payload_too_large;
        error_page 500 @api_server_error;
        error_page 502 @api_bad_gateway;
        error_page 504 @api_gateway_timeout;
    }

    location @api_payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"El archivo o la solicitud es demasiado grande."}}';
    }

    location @api_server_error {
        default_type application/json;
        return 500 '{"error":{"code":"server_error","message":"Algo salió mal de nuestro lado. Intenta más tarde."}}';
    }

    location @api_bad_gateway {
        default_type application/json;
        return 502 '{"error":{"code":"bad_gateway","message":"El servicio no está disponible ahora. Intenta más tarde."}}';
    }

    location @api_gateway_timeout {
        default_type application/json;
        return 504 '{"error":{"code":"gateway_timeout","message":"El servicio no respondió a tiempo. Intenta más tarde."}}';
    }

    location = /mailpit {
        return 308 /mailpit/;
    }

    location /mailpit/ {
        # Only from this computer, never through the phone tunnel.
        if ($host !~ ^(localhost|127\.0\.0\.1)$) {
            return 404;
        }

        # Looked up per request through Docker's DNS, so the proxy still starts
        # when Mailpit is off (CI and production run without the development profile).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mailpit http://mailpit:8025;
        proxy_pass $mailpit;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}