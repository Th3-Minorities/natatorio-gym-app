; OPcache keeps compiled PHP in memory, so each request does not parse every Laravel file again.
; Edits to the code still show within 2 seconds (validate_timestamps stays on, because the code folder
; is mounted from the host). Production can set opcache.validate_timestamps=0 and restart PHP on deploy.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
