; Our PHP settings, on top of php.ini-production (see the Dockerfile).
; No PHP version in the response headers (docs/design/api-conventions.md: no versions or internals).
expose_php = Off

; Uploads up to 10 MB; the proxy allows 12m to fit the form fields.
; post_max_size is a little higher because the request also carries the form fields, not only the file.
upload_max_filesize = 10M
post_max_size = 12M
