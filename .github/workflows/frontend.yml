name: Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The built PWA through the proxy, talking to the real API, like a phone through the tunnel.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same start as the backend workflow (see backend.yml for why).
      - name: Start the stack
        working-directory: .
        run: |
          chmod -R a+rwX backend
          docker compose --profile development up -d --build --wait
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate'
          # The staff sign-in test (#16) signs in with the seeder's fake accounts.
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force

      - run: npm ci
      - run: npx playwright install --with-deps chromium msedge
      - name: Set User browser test credentials
        run: grep -E '^E2E_USER_(EMAIL|PASSWORD)=' ../backend/.env.example >> "$GITHUB_ENV"
      # The User sign-in tests share one account and each sign-in ends the account's other sessions, so browsers run one at a time.
      - run: npx playwright test --workers=1

      # #82: every axe scan saves its result. A violation already fails the test above; these files are the record.
      - name: Save the accessibility scan results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: a11y-results
          path: frontend/a11y-results
          if-no-files-found: warn

      - name: Container logs
        if: failure()
        working-directory: .
        run: docker compose --profile development logs

      - name: Stop the containers
        if: always()
        working-directory: .
        run: docker compose --profile development down --volumes
