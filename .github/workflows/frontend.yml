name: Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The built PWA through the proxy, talking to the real API, like a phone through the tunnel.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same start as the backend workflow (see backend.yml for why).
      - name: Start the stack
        working-directory: .
        run: |
          chmod -R a+rwX backend
          docker compose up -d --build --wait
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate'
          # The staff sign-in test (#16) signs in with the seeder's fake accounts.
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force

      - run: npm ci
      - run: npx playwright install --with-deps chromium msedge
      - run: npx playwright test

      - name: Container logs
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Stop the containers
        if: always()
        working-directory: .
        run: docker compose down --volumes
