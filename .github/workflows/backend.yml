name: Backend

# Runs the backend checks in the same containers we use locally,
# so what passes here is what runs on the CTI VM.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Start the containers
        run: docker compose up -d --build --wait proxy

      - name: Install packages
        run: |
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate'
          # PHP-FPM runs as www-data and must write logs and caches.
          docker compose exec -T app chmod -R a+rwX storage bootstrap/cache

      - name: Lint
        run: docker compose exec -T app composer lint

      - name: Migrate and seed
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force

      - name: Tests
        run: docker compose exec -T app php artisan test

      - name: Health check through the proxy
        run: curl -fsS http://127.0.0.1:8080/api/health

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes
