name: Backend

# Runs the backend checks in the same containers we use locally,
# so what passes here is what runs on the CTI VM.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      # The containers run as www-data, and on Linux the checked-out folder belongs to another user.
      # www-data must write vendor/, .env, logs and caches.
      - name: Let the containers write to the backend folder
        run: chmod -R a+rwX backend

      # Every container, like README "First run" step 1 on a fresh clone (no vendor/ yet).
      # The scheduler is included, so CI fails if it stops while waiting for the packages.
      - name: Start the containers
        run: docker compose up -d --build --wait

      - name: Install packages
        run: |
          docker compose exec -T app composer install --no-interaction --no-progress
          docker compose exec -T app sh -c 'cp .env.example .env && php artisan key:generate'

      - name: Lint
        run: docker compose exec -T app composer lint

      - name: Migrate and seed
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force

      - name: Tests
        run: docker compose exec -T app php artisan test

      # The scheduler starts by itself once vendor/autoload.php exists (no restart step in the README).
      # It has a restart policy, so a crash loop looks alive. It must also stay up: no restart for 20 seconds.
      - name: Scheduler started by itself and keeps running
        run: |
          scheduler="$(docker compose ps -q scheduler)"
          started=false
          for attempt in $(seq 1 15); do
            if docker compose top scheduler | grep -q "schedule:work"; then started=true; break; fi
            sleep 2
          done
          if [ "$started" != true ]; then
            docker compose top scheduler
            exit 1
          fi
          before="$(docker inspect -f '{{.RestartCount}}' "$scheduler")"
          sleep 20
          after="$(docker inspect -f '{{.RestartCount}}' "$scheduler")"
          docker compose top scheduler | grep -q "schedule:work"
          if [ "$before" != "$after" ]; then
            echo "The scheduler restarted $((after - before)) time(s) in 20 seconds."
            docker compose logs scheduler
            exit 1
          fi

      # Compares the whole answer: a broken app can still answer 200 with an error page.
      # No -f, so a failing answer is printed before the comparison fails.
      - name: Health check through the proxy
        run: |
          body="$(curl -sS http://127.0.0.1:8080/api/health)"
          echo "$body"
          test "$body" = '{"status":"ok"}'

      # api-conventions.md: no versions or internals in answers (expose_php = Off in docker/php/app.ini).
      - name: No PHP version in the headers
        run: |
          headers="$(curl -sSI http://127.0.0.1:8080/api/health)"
          echo "$headers"
          if echo "$headers" | grep -qi '^x-powered-by'; then
            echo "The answer shows X-Powered-By (the PHP version)."
            exit 1
          fi

      # The tests run inside PHP, so only this step sees the real answer through the proxy.
      - name: Health check answers 503 when the database is down
        run: |
          docker compose stop db
          status="$(curl -sS -o /tmp/health-503.json -w '%{http_code}' http://127.0.0.1:8080/api/health)"
          cat /tmp/health-503.json
          test "$status" = 503
          grep -q '"code":"database_unavailable"' /tmp/health-503.json

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes
