name: Report PDF

on:
  push:
    branches: ['docs/progress-report']
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic
        run: curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
      - name: Build the PDF
        working-directory: docs/progress_report
        run: ../../tectonic -X compile main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: progress-report
          path: docs/progress_report/main.pdf
          retention-days: 14
      - name: Publish the PDF to the report-pdf branch
        run: |
          cp docs/progress_report/main.pdf /tmp/progress-report.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan report-pdf
          git rm -rfq .
          cp /tmp/progress-report.pdf progress-report.pdf
          git add progress-report.pdf
          git commit -qm "Progress report PDF from ${GITHUB_SHA::7} [skip ci]"
          git push -f origin report-pdf
